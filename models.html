<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>世界模型原型 · Token 蛛</title>
    <meta name="description" content="Token 蛛的世界模型原型：树、石与沼石。" />
    <meta name="theme-color" content="#f3efe6" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  </head>
  <body>
    <main id="models">
      <div id="models-stage"></div>
      <header class="models-head">
        <p class="models-kicker">Token 蛛 · Model Sheet</p>
        <h1>树 · 石 · 沼石</h1>
        <p class="models-sub">
          三种准备长进岛上的东西。纸面填色，墨线勾边，形状全部由种子生成。
          <em>苹果和草</em>留在场景里，当作比例参照。
        </p>
      </header>
      <p class="models-stats" id="models-stats">正在铺纸…</p>
      <div class="models-labels" id="models-labels"></div>
      <p class="models-hint">拖动旋转 · 滚轮缩放 · R 换一批</p>
      <div class="models-tools">
        <button id="models-turn" type="button" aria-pressed="true">转台</button>
        <button id="models-reroll" type="button">换一批 <kbd>R</kbd></button>
        <button id="models-labels-toggle" type="button" aria-pressed="true">
          标签 <kbd>L</kbd>
        </button>
      </div>
    </main>
    <script type="module" src="/src/client/models/page.ts"></script>
  </body>
</html>
